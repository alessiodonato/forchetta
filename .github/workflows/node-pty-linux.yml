name: node-pty for Linux

# node-pty ships no binaries for Linux: these are compiled from the version in pnpm-lock.yaml, on the oldest Ubuntu
# Forchetta supports (its tmux is 3.2), and go in the archive of a release (scripts/fetch-linux-pty.sh). The actions are
# at a fixed commit, and no cache is used: what they make runs on the computers of who installs Forchetta.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Compiles node-pty (pnpm.onlyBuiltDependencies in package.json).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: It opens a terminal
        run: |
          node -e '
            const pty = require("node-pty").spawn("/bin/echo", ["it works"], {});
            let out = "";
            pty.onData((data) => (out += data));
            pty.onExit(() => process.exit(out.includes("it works") ? 0 : 1));
          '

      - name: Collect the binary
        run: |
          mkdir out
          cp node_modules/node-pty/build/Release/pty.node out/
          strip --strip-unneeded out/pty.node
          sha256sum out/pty.node

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: node-pty-linux-${{ matrix.arch }}
          path: out/pty.node
          if-no-files-found: error
