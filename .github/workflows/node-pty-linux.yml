name: node-pty for Linux

# node-pty ships no binaries for Linux: these are compiled from the version in pnpm-lock.yaml, on the oldest Ubuntu
# Forchetta supports (its tmux is 3.2), and go in the archive of a release (scripts/fetch-linux-pty.sh).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Compiles node-pty (pnpm.onlyBuiltDependencies in package.json).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: It opens a terminal
        run: |
          node -e '
            const pty = require("node-pty").spawn("/bin/echo", ["it works"], {});
            let out = "";
            pty.onData((data) => (out += data));
            pty.onExit(() => process.exit(out.includes("it works") ? 0 : 1));
          '

      - name: Collect the binary
        run: |
          mkdir out
          cp node_modules/node-pty/build/Release/pty.node out/
          strip --strip-unneeded out/pty.node
          sha256sum out/pty.node

      - uses: actions/upload-artifact@v5
        with:
          name: node-pty-linux-${{ matrix.arch }}
          path: out/pty.node
          if-no-files-found: error
