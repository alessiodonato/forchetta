name: Windows native (trial)

# A trial, not a release: whether Forchetta can run on Windows with no WSL. Nothing is published and no secret is used.
on:
  push:
    branches: [windows-native]

permissions:
  contents: read

jobs:
  sessions:
    name: Sessions and hooks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: spike
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: A session that outlives who started it
        if: always()
        run: node holder-test.mjs
      - name: Install Claude Code
        if: always()
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Claude Code, with Git Bash
        if: always()
        run: node claude-test.mjs
      - name: Claude Code, without Git Bash
        if: always()
        run: |
          Rename-Item 'C:\Program Files\Git' 'Git-away'
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          try { node claude-test.mjs } finally { Rename-Item 'C:\Program Files\Git-away' 'Git' }

  code:
    name: The code as it is today, on Windows
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: always()
        run: pnpm typecheck
      - name: Build
        if: always()
        run: pnpm build
      - name: Tests, to count what has to change
        if: always()
        continue-on-error: true
        run: pnpm exec vitest run
