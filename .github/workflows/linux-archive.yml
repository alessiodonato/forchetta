name: Archive for Linux and Windows

# Makes the archives that docs/install.sh installs on Linux (and on Windows inside WSL 2) and docs/install.ps1 on Windows,
# and tries them. Here and nowhere else: no binary of them comes from the computer of a person. It only reads the repository: linux-release.yml calls it and
# publishes what it makes, CI calls it to try it. The actions are at a fixed commit, and no cache is used: what comes out
# runs on the computers of others.
on:
  workflow_call:
    outputs:
      archive:
        description: The sha256 of the archive, as the job that packed it read it
        value: ${{ jobs.archive.outputs.archive }}
      installer:
        description: The sha256 of its install.sh
        value: ${{ jobs.archive.outputs.installer }}
      windows:
        description: The sha256 of the archive for Windows
        value: ${{ jobs.archive.outputs.windows }}
      windows-installer:
        description: The sha256 of its install.ps1
        value: ${{ jobs.archive.outputs.windows-installer }}

permissions:
  contents: read

# Said by name, bash stops also when the first command of a pipe fails.
defaults:
  run:
    shell: bash

jobs:
  # node-pty ships no binaries for Linux: these are compiled from the version in pnpm-lock.yaml, on the oldest Ubuntu
  # Forchetta supports (its tmux is 3.2).
  terminals:
    name: Terminals for linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Compiles node-pty, the only package whose scripts run (pnpm.onlyBuiltDependencies in package.json).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: It opens a terminal
        run: |
          node -e '
            const pty = require("node-pty").spawn("/bin/echo", ["it works"], {});
            let out = "";
            pty.onData((data) => (out += data));
            pty.onExit(() => process.exit(out.includes("it works") ? 0 : 1));
          '

      - name: Collect the binary
        run: |
          mkdir out
          cp node_modules/node-pty/build/Release/pty.node out/
          strip --strip-unneeded out/pty.node
          # Ubuntu 22.04 has glibc 2.35: nothing newer may be asked for.
          objdump -T out/pty.node | grep -o 'GLIBC_[0-9.]*' | sort -uV | tee glibc.txt
          test "$(printf '%s\nGLIBC_2.35\n' "$(tail -n 1 glibc.txt)" | sort -V | tail -n 1)" = GLIBC_2.35
          sha256sum out/pty.node

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-pty-linux-${{ matrix.arch }}
          path: out/pty.node
          if-no-files-found: error
          retention-days: 7

  archive:
    name: Archive
    needs: terminals
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      archive: ${{ steps.sums.outputs.archive }}
      installer: ${{ steps.sums.outputs.installer }}
      windows: ${{ steps.sums.outputs.windows }}
      windows-installer: ${{ steps.sums.outputs.windows-installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-pty-linux-x64
          path: build/node-pty-linux/linux-x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-pty-linux-arm64
          path: build/node-pty-linux/linux-arm64

      - name: Pack
        run: |
          pnpm build
          sh scripts/package-linux.sh
          sh scripts/package-windows.sh
          cp -R build/release first

      # The page and the daemon built again, and packed: the same bytes. The terminals are those of the job before.
      - name: Pack again, and compare
        run: |
          pnpm build
          sh scripts/package-linux.sh
          sh scripts/package-windows.sh
          diff -r first build/release

      - name: Nothing of a Mac is in it, nor of who made it
        run: |
          tar -tvzf first/*-linux.tar.gz | tee list.txt
          test -s list.txt
          if grep -E 'darwin|win32|dist/windows|\.cmd$|native/|\.swift|build-app|\.map$' list.txt; then exit 1; fi
          # Every file of root, none that others can write.
          if awk '{ print $1, $2 }' list.txt | grep -v -E '^[d-][rwx-]{4}-[rwx-]{2}-[x-] 0/0$'; then exit 1; fi

      # What runs on Windows is Node.js, and the code of Forchetta: of programs there are only the console of Microsoft and
      # the two binaries of node-pty, as npm gives them.
      - name: Nothing else is in the one for Windows
        run: |
          tar -tzf first/*-windows.tar.gz | tee list.txt
          if grep -E 'darwin|linux|native/|\.swift|build-app|\.map$|\.pdb$|winpty' list.txt; then exit 1; fi
          grep -E '\.(exe|dll|node)$' list.txt | sed 's/^[^/]*//' | sort > binaries.txt
          for arch in arm64 x64; do
            for file in conpty.node conpty/OpenConsole.exe conpty/conpty.dll conpty_console_list.node; do echo "/node_modules/node-pty/prebuilds/win32-$arch/$file"; done
          done | sort | diff - binaries.txt

      # For who publishes them: the files themselves pass through jobs that could change them.
      - name: Their checksums
        id: sums
        run: |
          echo "archive=$(sha256sum first/*-linux.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "installer=$(sha256sum first/install.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "windows=$(sha256sum first/*-windows.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "windows-installer=$(sha256sum first/install.ps1 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-archive
          path: first/
          if-no-files-found: error
          retention-days: 7

  # As a person would, from the oldest to the newest Ubuntu and on both processors.
  install:
    name: Install on ${{ matrix.os }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, ubuntu-26.04]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-archive
          path: release

      - name: Install tmux and lsof
        run: sudo apt-get update && sudo apt-get install -y tmux lsof

      # With no Node.js in the PATH: the installer takes its own, from nodejs.org.
      - name: Install and open
        run: |
          version=$(sed -n 's/^PINNED_VERSION=//p' release/install.sh)
          test -n "$version"
          mkdir -p "$RUNNER_TEMP/releases/download/v$version" "$RUNNER_TEMP/home"
          cp release/forchetta-* "$RUNNER_TEMP/releases/download/v$version/"
          export HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin FORCHETTA_RELEASES="file://$RUNNER_TEMP/releases" FORCHETTA_PROTO='=file,https' FORCHETTA_NO_SETUP=1
          if command -v node; then echo "there is a Node.js here: this must try without"; exit 1; fi
          sh release/install.sh
          forchetta="$HOME/.local/bin/forchetta"
          test "$("$forchetta" --version)" = "$version"
          "$forchetta" setup --yes
          grep -q "$HOME/.local/lib/forchetta/bin/forchetta-hook" "$HOME/.claude/settings.json"
          "$forchetta" open --print | grep -q '^http://127.0.0.1:47821/#open='
          test -S "$HOME/.local/share/forchetta/hooks.sock"
          test ! -e "$HOME/Library"
          "$forchetta" daemon stop

      - name: A changed archive is refused
        run: |
          version=$(sed -n 's/^PINNED_VERSION=//p' release/install.sh)
          there="$RUNNER_TEMP/releases/download/v$version"
          # Another archive, whole, and with a checksum of its own next to it: the one in the installer counts.
          mkdir "$RUNNER_TEMP/changed" "$RUNNER_TEMP/other"
          tar -xzf "release/forchetta-$version-linux.tar.gz" -C "$RUNNER_TEMP/changed"
          echo changed >> "$RUNNER_TEMP/changed/forchetta-$version/LICENSE"
          tar -czf "$there/forchetta-$version-linux.tar.gz" -C "$RUNNER_TEMP/changed" "forchetta-$version"
          (cd "$there" && sha256sum "forchetta-$version-linux.tar.gz" > "forchetta-$version-linux.tar.gz.sha256")
          if HOME="$RUNNER_TEMP/other" FORCHETTA_RELEASES="file://$RUNNER_TEMP/releases" FORCHETTA_PROTO='=file,https' FORCHETTA_NO_SETUP=1 sh release/install.sh 2> "$RUNNER_TEMP/refused"; then echo "it was installed"; exit 1; fi
          cat "$RUNNER_TEMP/refused"
          grep -q 'not the one of the release' "$RUNNER_TEMP/refused"
          test ! -e "$RUNNER_TEMP/other/.local"

  # The same on Windows, in the PowerShell every Windows has, in a home with a space in its name.
  install-windows:
    name: Install on ${{ matrix.os }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-archive
          path: release

      # With no Node.js in the PATH: the installer takes its own, from nodejs.org.
      - name: Install and open
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Match((Get-Content -Raw release\install.ps1), "PinnedVersion = '([^']+)'").Groups[1].Value
          if (-not $version) { throw 'no version' }
          $userHome = Join-Path $env:RUNNER_TEMP 'Ada Lovelace'
          $there = Join-Path $env:RUNNER_TEMP "releases\download\v$version"
          # A home has its Start menu.
          New-Item -ItemType Directory -Force $there, $userHome, (Join-Path $userHome 'AppData\Roaming\Microsoft\Windows\Start Menu\Programs') | Out-Null
          Copy-Item release\forchetta-* $there
          $env:USERPROFILE = $userHome
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'there is a Node.js here: this must try without' }
          $env:FORCHETTA_RELEASES = Join-Path $env:RUNNER_TEMP 'releases'
          $env:FORCHETTA_NO_SETUP = '1'
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          $forchetta = Join-Path $userHome '.local\bin\forchetta.cmd'
          if ((& $forchetta --version) -ne $version) { throw 'the command does not answer' }
          if ((forchetta --version) -ne $version) { throw 'it is not in the PATH of this terminal' }
          & $forchetta setup --yes
          if ($LASTEXITCODE -ne 0) { throw 'setup' }
          $settings = Get-Content -Raw (Join-Path $userHome '.claude\settings.json')
          if ($settings -notmatch 'Ada Lovelace/\.local/lib/forchetta/dist/windows/forchetta-hooks\.js') { throw $settings }
          if ($settings -match 'forchetta-versions') { throw 'the hooks name a version' }
          if ((& $forchetta open --print) -notmatch '^http://127\.0\.0\.1:47821/#open=') { throw 'open' }
          if (-not (Test-Path (Join-Path $userHome '.local\share\forchetta\hooks-pipe.json'))) { throw 'no pipe' }
          # Again, with everything in use: the same version, and then as a newer one would be.
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          if ((& $forchetta --version) -ne $version) { throw 'after the second time' }
          & $forchetta daemon stop
          $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($path -split ';' | Where-Object { $_ -eq (Join-Path $userHome '.local\bin') }).Count -gt 1) { throw "twice in the PATH: $path" }
          if (-not (Get-ChildItem -Recurse -Filter Forchetta.lnk (Join-Path $userHome 'AppData'), (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu'))) { throw 'no shortcut' }

      # As winget and the version managers keep it: an update takes that folder away, and the hooks would stop.
      - name: The hooks run on no Node.js that an update takes away
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Match((Get-Content -Raw release\install.ps1), "PinnedVersion = '([^']+)'").Groups[1].Value
          # The Node.js that the step before took, put where one of the PC could be.
          $node = Join-Path $env:RUNNER_TEMP 'Ada Lovelace\.local\lib\forchetta-node\node.exe'
          $others = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) }) -join ';'
          $env:FORCHETTA_RELEASES = Join-Path $env:RUNNER_TEMP 'releases'
          $env:FORCHETTA_NO_SETUP = '1'
          $env:FORCHETTA_NO_SHORTCUT = '1'
          $cases = @(
            @{ Name = 'versioned'; Folder = 'node-v22.0.0-win-x64'; Reach = $true; Own = $true },
            @{ Name = 'lasting'; Folder = 'nodejs'; Reach = $false; Own = $false },
            @{ Name = 'offline'; Folder = 'node-v22.0.0-win-x64'; Reach = $false; Own = $false }
          )
          foreach ($case in $cases) {
            $userHome = Join-Path $env:RUNNER_TEMP "home-$($case.Name)"
            $there = Join-Path $env:RUNNER_TEMP $case.Folder
            New-Item -ItemType Directory -Force $userHome, $there | Out-Null
            Copy-Item -LiteralPath $node -Destination (Join-Path $there 'node.exe') -Force
            $env:USERPROFILE = $userHome
            $env:Path = "$there;$others"
            # A place with nothing in it is a nodejs.org that does not answer.
            if ($case.Reach) { $env:FORCHETTA_NODE_DIST = '' } else { $env:FORCHETTA_NODE_DIST = Join-Path $env:RUNNER_TEMP 'no-such-place' }
            Get-Content -Raw release\install.ps1 | Invoke-Expression
            $forchetta = Join-Path $userHome '.local\bin\forchetta.cmd'
            if ((& $forchetta --version) -ne $version) { throw "$($case.Name): the command does not answer" }
            # In a repository with a node.exe of its own: that one must not run.
            $repo = Join-Path $env:RUNNER_TEMP "repo-$($case.Name)"
            New-Item -ItemType Directory -Force $repo | Out-Null
            Copy-Item (Join-Path $env:SystemRoot 'System32\where.exe') (Join-Path $repo 'node.exe') -Force
            Push-Location $repo
            $said = & $forchetta --version
            Pop-Location
            if ($said -ne $version) { throw "$($case.Name): the node.exe of the folder ran: $said" }
            $own = Test-Path (Join-Path $userHome '.local\lib\forchetta-node\node.exe')
            if ($own -ne $case.Own) { throw "$($case.Name): a Node.js of its own: $own" }
            & $forchetta setup --yes --no-restart
            if ($LASTEXITCODE -ne 0) { throw "$($case.Name): setup" }
            $settings = Get-Content -Raw (Join-Path $userHome '.claude\settings.json')
            if ($case.Own) {
              if ($settings -notmatch 'forchetta-node/node\.exe') { throw "$($case.Name): $settings" }
              if ($settings -match 'node-v22\.0\.0') { throw "$($case.Name): the hooks name a version of Node.js: $settings" }
            } elseif ($settings -notmatch "$($case.Folder -replace '\.', '\.')/node\.exe") { throw "$($case.Name): $settings" }
          }
          # As who has a beta that wrote the versioned one: the installer again, and the hooks move to the one that stays.
          $userHome = Join-Path $env:RUNNER_TEMP 'home-offline'
          $env:FORCHETTA_NODE_DIST = ''
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          $forchetta = Join-Path $userHome '.local\bin\forchetta.cmd'
          & $forchetta setup --yes --no-restart
          if ($LASTEXITCODE -ne 0) { throw 'setup again' }
          $settings = Get-Content -Raw (Join-Path $userHome '.claude\settings.json')
          if ($settings -notmatch 'forchetta-node/node\.exe' -or $settings -match 'node-v22\.0\.0') { throw "again: $settings" }

      # Who has a beta before: its installer and its setup, its daemon at work, and this one over them. The first one named a
      # Node.js in a folder of its version.
      - name: An update from the betas before
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Match((Get-Content -Raw release\install.ps1), "PinnedVersion = '([^']+)'").Groups[1].Value
          $others = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) }) -join ';'
          foreach ($before in '0.13.0-beta.2', '0.13.0-beta.3') {
            $userHome = Join-Path $env:RUNNER_TEMP "home-from-$before"
            New-Item -ItemType Directory -Force $userHome | Out-Null
            $env:USERPROFILE = $userHome
            $env:Path = "$(Join-Path $env:RUNNER_TEMP 'node-v22.0.0-win-x64');$others"
            $env:FORCHETTA_NO_SETUP = '1'
            $env:FORCHETTA_NO_SHORTCUT = '1'
            $env:FORCHETTA_RELEASES = ''
            Invoke-RestMethod "https://github.com/alessiodonato/forchetta/releases/download/v$before/install.ps1" | Invoke-Expression
            $forchetta = Join-Path $userHome '.local\bin\forchetta.cmd'
            if ((& $forchetta --version) -ne $before) { throw "$before is not there" }
            & $forchetta setup --yes
            if ($LASTEXITCODE -ne 0) { throw "setup of $before" }
            & $forchetta daemon start
            if ($LASTEXITCODE -ne 0) { throw "daemon of $before" }
            $file = Join-Path $userHome '.claude\settings.json'
            $named = (Get-Content -Raw $file) -match 'node-v22\.0\.0'
            if ($before -eq '0.13.0-beta.2' -and -not $named) { throw "$before does not name a version of Node.js: this tries nothing" }
            $env:FORCHETTA_RELEASES = Join-Path $env:RUNNER_TEMP 'releases'
            Get-Content -Raw release\install.ps1 | Invoke-Expression
            if ((& $forchetta --version) -ne $version) { throw "$before was not updated" }
            & $forchetta setup --yes
            if ($LASTEXITCODE -ne 0) { throw "setup over $before" }
            $settings = Get-Content -Raw $file
            if ($settings -notmatch 'forchetta-node/node\.exe' -or $settings -match 'node-v22\.0\.0') { throw "over ${before}: $settings" }
            # Each hook once, in the place of the one that was there.
            $json = $settings | ConvertFrom-Json
            foreach ($event in $json.hooks.PSObject.Properties) {
              $kinds = @($event.Value | ForEach-Object { $_.hooks } | ForEach-Object { $_.args[1] })
              if ($kinds.Count -ne @($kinds | Select-Object -Unique).Count) { throw "over ${before}, $($event.Name): twice" }
            }
            $status = (& $forchetta daemon status) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $status -notmatch [regex]::Escape($version)) { throw "over ${before}, the daemon is not the new one: $status" }
            if ((& $forchetta open --print) -notmatch '^http://127\.0\.0\.1:47821/#open=') { throw "open over $before" }
            # And once more, as the page does: the installer of the release, with its checksum, then the setup of what it put there.
            $installer = (Resolve-Path release\install.ps1).Path
            $digest = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            $source = Join-Path $userHome 'releases.json'
            $list = ConvertTo-Json -Depth 5 -InputObject @(@{ tag_name = "v$version"; draft = $false; assets = @(@{ name = 'install.ps1'; browser_download_url = $installer; digest = "sha256:$digest" }) })
            [IO.File]::WriteAllText($source, $list)
            $env:FORCHETTA_UPDATE_SOURCE = $source
            $env:FORCHETTA_UPDATE_FROM = '0.0.1'
            & $forchetta update --page
            $code = $LASTEXITCODE
            $state = Get-Content -Raw (Join-Path $userHome '.local\share\forchetta\update-run.json')
            if ($code -ne 0 -or $state -notmatch '"state": "done"') { throw "update over ${before}: $code $state" }
            # An installer that is not the one GitHub says does not run.
            [IO.File]::WriteAllText($source, $list.Replace($digest, ('0' * 64)))
            & $forchetta update --page
            $code = $LASTEXITCODE
            $state = Get-Content -Raw (Join-Path $userHome '.local\share\forchetta\update-run.json')
            if ($code -eq 0 -or $state -notmatch 'not the one of the release') { throw "a changed installer ran: $code $state" }
            Remove-Item Env:FORCHETTA_UPDATE_SOURCE, Env:FORCHETTA_UPDATE_FROM
            & $forchetta daemon stop
          }

      - name: A changed archive is refused
        run: |
          $version = [regex]::Match((Get-Content -Raw release\install.ps1), "PinnedVersion = '([^']+)'").Groups[1].Value
          $there = Join-Path $env:RUNNER_TEMP "releases\download\v$version"
          # Another archive, whole, and with a checksum of its own next to it: the one in the installer counts.
          Add-Content -Path (Join-Path $there "forchetta-$version-windows.tar.gz") -Value 'changed'
          $hash = (Get-FileHash (Join-Path $there "forchetta-$version-windows.tar.gz")).Hash.ToLower()
          Set-Content -Path (Join-Path $there "forchetta-$version-windows.tar.gz.sha256") -Value "$hash  forchetta-$version-windows.tar.gz"
          $other = Join-Path $env:RUNNER_TEMP 'other'
          New-Item -ItemType Directory $other | Out-Null
          $env:USERPROFILE = $other
          $env:FORCHETTA_RELEASES = Join-Path $env:RUNNER_TEMP 'releases'
          $env:FORCHETTA_NO_SETUP = '1'
          $env:FORCHETTA_EXIT = '1'
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File release\install.ps1 *>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'not the one of the release') { throw 'it was not refused' }
          if (Test-Path (Join-Path $other '.local\lib\forchetta')) { throw 'something was installed' }
          exit 0
