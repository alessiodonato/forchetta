name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm at the version in package.json (packageManager).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The tests start a private tmux server, like the daemon does.
      - name: Install tmux
        run: brew install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: pnpm test

      - name: Build the CLI, the daemon and the page
        run: pnpm build

      - name: Build the app
        run: pnpm build:app

  # Windows itself, with no WSL: the hosts of the sessions in place of tmux, and the real Claude Code with a stand-in for its
  # API (no account, no secret), with Git Bash and without.
  windows:
    name: Tests and build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: pnpm test

      - name: Build the CLI, the daemon and the page
        if: always()
        run: pnpm build

      - name: Install Claude Code
        if: always()
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: End to end, with Git Bash
        if: always()
        run: node scripts/dev/windows-e2e.mjs

      - name: End to end, without Git Bash
        if: always()
        run: |
          # git stays, its bash goes.
          Rename-Item 'C:\Program Files\Git\bin\bash.exe' 'bash-away.exe'
          Rename-Item 'C:\Program Files\Git\usr\bin\bash.exe' 'bash-away.exe'
          try { node scripts/dev/windows-e2e.mjs } finally {
            Rename-Item 'C:\Program Files\Git\bin\bash-away.exe' 'bash.exe'
            Rename-Item 'C:\Program Files\Git\usr\bin\bash-away.exe' 'bash.exe'
          }

  # Linux is also what Forchetta runs on in Windows, inside WSL 2. node-pty is compiled here: it ships no binaries for Linux.
  linux:
    name: Tests and build on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install tmux and lsof
        run: sudo apt-get update && sudo apt-get install -y tmux lsof

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: pnpm test

      - name: Build the CLI, the daemon and the page
        run: pnpm build

      # No hook is written: without --yes, and with no terminal, the setup only checks and shows, and says so (exit code 2).
      - name: The setup finds everything
        run: |
          status=0
          bin/forchetta setup --no-restart || status=$?
          test "$status" -eq 2
          if grep -qs forchetta "$HOME/.claude/settings.json"; then echo "hooks were written"; exit 1; fi

      - name: The page opens with a code, good once, only at its own address
        run: |
          url=$(bin/forchetta open --print)
          code=${url##*#open=}
          trade() { curl -fsS -H "Origin: $1" -H 'Content-Type: application/json' -d "{\"code\":\"$code\"}" http://127.0.0.1:47821/open; }
          if trade http://localhost:47821; then echo "localhost is for WSL only"; exit 1; fi
          # Another user, who can read the code among the arguments of the browser, gets nothing with it.
          if sudo -u nobody curl -fsS -H "Origin: http://127.0.0.1:47821" -H 'Content-Type: application/json' -d "{\"code\":\"$code\"}" http://127.0.0.1:47821/open; then echo "the code was good for another user"; exit 1; fi
          trade http://127.0.0.1:47821 | grep -q token
          if trade http://127.0.0.1:47821; then echo "the code was good twice"; exit 1; fi
          bin/forchetta doctor | grep -v 'Claude Code'
          bin/forchetta daemon stop

      # As forchetta.dev/windows says to, with no pnpm in the PATH and no root.
      - name: A clone builds with scripts/from-source.sh
        run: |
          git clone -q . "$RUNNER_TEMP/clone/forchetta"
          PATH=$(dirname "$(command -v node)"):/usr/bin:/bin sh "$RUNNER_TEMP/clone/forchetta/scripts/from-source.sh"
          test "$("$RUNNER_TEMP/clone/forchetta/bin/forchetta" --version)" = "$(node -p "require('./package.json').version")"

      # The archive of Linux, installed as a person would. The binary of arm64 is not compiled here: the other one, only to pack.
      - name: The archive of Linux installs, with nothing of a Mac in it
        run: |
          for arch in x64 arm64; do
            mkdir -p "build/node-pty-linux/linux-$arch"
            cp node_modules/node-pty/build/Release/pty.node "build/node-pty-linux/linux-$arch/"
          done
          sh scripts/package-linux.sh
          grep -qx "PINNED_SHA256=$(sha256sum build/release/*-linux.tar.gz | cut -d' ' -f1)" build/release/install.sh
          version=$(node -p "require('./package.json').version")
          archive="forchetta-$version-linux.tar.gz"
          tar -tzf "build/release/$archive" > "$RUNNER_TEMP/list.txt"
          if grep -E 'darwin|native/|\.swift|build-app' "$RUNNER_TEMP/list.txt"; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/releases/download/v$version" "$RUNNER_TEMP/home"
          cp "build/release/$archive" "build/release/$archive.sha256" "$RUNNER_TEMP/releases/download/v$version/"
          export HOME="$RUNNER_TEMP/home" FORCHETTA_RELEASES="file://$RUNNER_TEMP/releases" FORCHETTA_PROTO==file FORCHETTA_VERSION="$version" FORCHETTA_NO_SETUP=1
          sh docs/install.sh
          forchetta="$HOME/.local/bin/forchetta"
          test "$("$forchetta" --version)" = "$version"
          "$forchetta" setup --yes
          grep -q "$HOME/.local/lib/forchetta/bin/forchetta-hook" "$HOME/.claude/settings.json"
          "$forchetta" open --print | grep -q '^http://127.0.0.1:47821/#open='
          test -S "$HOME/.local/share/forchetta/hooks.sock"
          test ! -e "$HOME/Library"
          "$forchetta" daemon stop

  # The archive of a release, as linux-release.yml makes it: only when a person starts this workflow.
  archive:
    name: Archive
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/linux-archive.yml
