<!doctype html>
<!--
  The image for link previews: docs/img/social.png, 1280×640, the og:image of the site and of the manual, and the
  Social preview of the repository on GitHub (Settings → Social preview, uploaded by hand).
  To make it again: open this page in Chrome at 1280×640 and take a screenshot of the whole page, for example with
  headless Chrome and Page.captureScreenshot through the DevTools protocol. The panel on the right is a crop of
  docs/img/guard.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forchetta social preview</title>
<style>
  :root {
    --bg: #1f1e1c;
    --text: #f3f1ec;
    --text-2: #bdb8ae;
    --line: #3a3834;
    --claude: #d97757;
    --ui: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }
  html, body { margin: 0; }
  body {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--claude); font-size: 28px; font-weight: 620; letter-spacing: 0.005em; }
  .brand svg { width: 36px; height: 36px; }
  h1 { margin: 34px 0 0; font-size: 42px; line-height: 1.12; font-weight: 680; letter-spacing: -0.03em; }
  h1 em { display: block; font-style: normal; color: var(--claude); }
  p { width: 540px; margin: 24px 0 0; font-size: 20px; line-height: 1.5; color: var(--text-2); }
  code { margin-top: 40px; padding: 11px 17px; border: 1px solid var(--line); border-radius: 8px; background: #262522; font-family: var(--mono); font-size: 18px; color: var(--text); }
  /* The pane of rate-limit, stopped by the guard: a crop of docs/img/guard.png (2800×1572, shown at half size). */
  .shot {
    position: absolute;
    left: 676px;
    top: 58px;
    width: 568px;
    height: 640px;
    background: url(../../docs/img/guard.png) no-repeat;
    background-size: 1400px 786px;
    background-position: -818px -44px;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 18 18" aria-hidden="true"><g fill="#d97757"><rect x="5.1" y="1.5" width="1.3" height="6" rx=".65"/><rect x="7.6" y="1.5" width="1.3" height="6" rx=".65"/><rect x="10.1" y="1.5" width="1.3" height="6" rx=".65"/><rect x="12.6" y="1.5" width="1.3" height="6" rx=".65"/><rect x="5.1" y="6.4" width="8.8" height="2.6" rx="1.3"/><path d="M7.4 8.6h4.2l-1.5 2.8H8.9z"/><rect x="8.6" y="10.8" width="1.8" height="6.4" rx=".9"/></g></svg>
      Forchetta
    </div>
    <h1>Run several Claude Code sessions in the same repo. <em>They won't step on each other.</em></h1>
    <p>When two sessions reach for the same file, one waits, and goes on by itself when the file is free.</p>
    <code>brew install alessiodonato/tap/forchetta</code>
  </div>
  <div class="shot" role="img" aria-label="The pane of rate-limit: its edit of src/api.ts stopped by the guard, because retries is changing it, and Claude saying it will wait."></div>
</body>
</html>
