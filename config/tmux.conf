# Server tmux privato di Forchetta (socket in var/tmux.sock). Non legge ~/.tmux.conf.
# tmux-256color manca dal terminfo di macOS 12: screen-256color c'è.
set -g default-terminal "screen-256color"
# Esc deve arrivare subito alla TUI di Claude Code.
set -sg escape-time 0
set -g status off
set -g history-limit 20000
set -g focus-events on
set -s extended-keys on
# Con più client (Terminale e Forchetta) la finestra prende la misura di quello usato per ultimo.
set -g window-size latest
set -g remain-on-exit off
# La rotella del mouse scorre la cronologia di tmux (e non i prompt precedenti di Claude Code).
set -g mouse on
# Trascinare il mouse seleziona con tmux e, al rilascio, copia negli appunti del Mac; doppio clic copia una
# parola, triplo clic una riga. Il server tmux gira sul Mac, quindi basta pbcopy.
# Selezione nativa del terminale, senza tmux: Fn + trascinamento in Terminal.app, Option in iTerm2 e in Forchetta.
set -s copy-command 'pbcopy'
