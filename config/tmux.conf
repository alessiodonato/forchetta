# Server tmux privato di Forchetta (socket in var/tmux.sock). Non legge ~/.tmux.conf.
# tmux-256color manca dal terminfo di macOS 12: screen-256color c'è.
set -g default-terminal "screen-256color"
# Esc deve arrivare subito alla TUI di Claude Code.
set -sg escape-time 0
set -g status off
set -g history-limit 20000
set -g focus-events on
set -s extended-keys on
# Con più client (Terminale e Forchetta) la finestra prende la misura di quello usato per ultimo.
set -g window-size latest
set -g remain-on-exit off
# La rotella del mouse scorre la cronologia di tmux (e non i prompt precedenti di Claude Code).
set -g mouse on
# Trascinare il mouse seleziona con tmux e, al rilascio, copia negli appunti del Mac; doppio clic copia una
# parola, triplo clic una riga. Il server tmux gira sul Mac, quindi basta pbcopy; dentro WSL gli appunti sono quelli
# di Windows (clip.exe vuole UTF-16), su Linux quelli di Wayland o di X. Senza nessuno di questi la copia resta a tmux.
# Selezione nativa del terminale, senza tmux: Fn + trascinamento in Terminal.app, Option in iTerm2 e in Forchetta.
#
# pbcopy legge il testo nella codifica della locale, e il server tmux può non averne una (app aperta dal Finder):
# senza LC_ALL lo prende per Mac Roman, e "perché" diventa "perch√©". Prima awk toglie ciò che disegna Claude Code:
# gli spazi unificatori (\302\240) diventano spazi, e se una riga comincia con un suo segno (❯ ⏺ ⎿) segno e margine
# se ne vanno. Fuori dal Mac Claude Code disegna ● al posto di ⏺: lì il segno tolto è quello. È tutto qui, e non in un
# file a parte, perché un server già acceso sopravvive agli aggiornamenti di Forchetta: il percorso di un file potrebbe
# non esserci più.
set -s copy-command 's="❯|●|⎿"; command -v pbcopy >/dev/null 2>&1 && s="❯|⏺|⎿"; LC_ALL=C awk -v nbsp="$(printf "\302\240")" -v signs="$s" "{ gsub(nbsp, \" \"); if (\$0 ~ \"^ *(\" signs \")( |\$)\") { sign = 1; sub(signs, \" \") } sub(/ +\$/, \"\"); if (match(\$0, /[^ ]/) && (!cut || RSTART < cut)) cut = RSTART; line[NR] = \$0 } END { for (i = 1; i <= NR; i++) printf \"%s%s\", (i > 1 ? \"\\n\" : \"\"), (sign ? substr(line[i], cut) : line[i]) }" | if command -v pbcopy >/dev/null 2>&1; then LC_ALL=en_US.UTF-8 pbcopy; elif [ -x /mnt/c/Windows/System32/clip.exe ]; then iconv -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -i >/dev/null 2>&1; else cat >/dev/null; fi'
